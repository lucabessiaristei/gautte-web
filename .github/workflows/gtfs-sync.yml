name: GTFS sync

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC: GTT publishes ~01:15 UTC, the HA mirror checks hourly
  workflow_dispatch:       # manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install psql 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17 unzip

      - name: Run ETL
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          GTFS_MIRROR_URL: https://rgiqoqmdffwtkwagnydf.supabase.co/storage/v1/object/public/gtfs
        run: ./etl/run.sh